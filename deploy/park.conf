# WonderPark Tycoon — gzip and cache headers for the static bundle.
#
# OPTIONAL. The game is a plain static bundle built by Vite with base './', so
# every asset reference is relative and it serves from any URL prefix with no
# rewrite rules and no router. Whatever Alias or vhost already maps a URL to
# the directory below will serve it as-is; this file only adds compression and
# cache headers, which are worth having for a 940 kB bundle.
#
# Applied by hand, not by deploy.sh — deploy.sh ships files and deliberately
# does not touch your httpd configuration:
#
#   sudo cp deploy/park.conf /etc/httpd/conf.d/park.conf
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# The paths below must match PARK_REMOTE in deploy/deploy.env. If configtest
# fails on ExpiresActive or Header, the instance is missing mod_expires or
# mod_headers — check `sudo httpd -M` before reloading, since Apache refuses
# to start on an unknown directive.

<Directory "/data/var/www/html/fun/theme">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Measured: 939.50 kB uncompressed, 277.53 kB gzipped (vite build output). Apache serves .js as text/javascript
# on current httpd; both spellings are listed so the filter applies either way.
AddOutputFilterByType DEFLATE text/javascript application/javascript text/css text/html application/json

# Vite emits content-hashed filenames under assets/, so they are immutable.
<Directory "/data/var/www/html/fun/theme/assets">
    ExpiresActive On
    ExpiresDefault "access plus 1 year"
    Header set Cache-Control "public, immutable"
</Directory>

# index.html names those hashed files, so it must never be cached — a stale
# copy would point at asset filenames that no longer exist after a redeploy.
<Directory "/data/var/www/html/fun/theme">
    <Files "index.html">
        ExpiresActive On
        ExpiresDefault "access plus 0 seconds"
        Header set Cache-Control "no-cache"
    </Files>
</Directory>
