# WonderPark Tycoon — static site served by Apache (httpd) on Amazon Linux 2023.
#
# Installed to /etc/httpd/conf.d/park.conf by ../deploy.sh, which rewrites the
# paths below if DOCROOT is overridden.
#
# The game is a pure static bundle built by Vite with base './', so every asset
# reference is relative and it serves correctly from any URL prefix. It has no
# client-side router, so no rewrite rules are needed either.
#
# Serves: http://<host>/park/

<Directory "/var/www/html/park">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# The three.js bundle is ~940 KB uncompressed and ~230 KB gzipped, which is the
# difference between a snappy load and several seconds on the splash screen.
# Apache serves .js as text/javascript on current httpd; both spellings are
# listed so the filter applies either way.
AddOutputFilterByType DEFLATE text/javascript application/javascript text/css text/html application/json

# Vite emits content-hashed filenames under assets/, so they are immutable.
<Directory "/var/www/html/park/assets">
    ExpiresActive On
    ExpiresDefault "access plus 1 year"
    Header set Cache-Control "public, immutable"
</Directory>

# index.html names those hashed files, so it must never be cached — a stale copy
# would point at asset filenames that no longer exist after a redeploy.
<Directory "/var/www/html/park">
    <Files "index.html">
        ExpiresActive On
        ExpiresDefault "access plus 0 seconds"
        Header set Cache-Control "no-cache"
    </Files>
</Directory>
